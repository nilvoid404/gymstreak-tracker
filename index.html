<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GymStreak</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <!-- Setup -->
    <div class="setup" id="setup">
      <h2>Login</h2>
      <input type="password" id="tokenInput" placeholder="Token" />
      <input type="password" id="passwordInput" placeholder="Password" />
      <button onclick="saveSetup()">Save</button>
    </div>
    <!-- Main App -->
    <div class="app hidden" id="app">

      <div class="header">
        <h1>💪 GymStreak</h1>
        <button class="reset-btn" onclick="resetApp()">⚙️</button>
      </div>

      <!-- Stats -->
      <div class="stats">
        <div class="stat">
          <span class="stat-num" id="streak">0</span>
          <span>day streak</span>
        </div>
        <div class="stat">
          <span class="stat-num" id="total">0</span>
          <span>total sessions</span>
        </div>
      </div>

      <!-- Log Workout -->
      <div class="log-section">
        <select id="workoutType">
          <option value="">Select Your Workout Type</option>
          <option value="Push">Push Day</option>
          <option value="Pull">Pull Day</option>
          <option value="Legs">Legs Day</option>
          <option value="Abs">Abs Day</option>
          <option value="Full">Full Body</option>
          <option value="Rest">Rest Day</option>
        </select>

        <input
          type="number"
          id="duration"
          placeholder="Minutes (e.g. 60)"
          min="0"
          max="300"
        />

        <button id="saveBtn" onclick="saveWorkout()">
          Save Today's Workout
        </button>

        <p class="msg" id="msg"></p>
      </div>

      <!-- Mode Toggle -->
      <div class="mode-toggle">
        <button class="mode-btn active" data-mode="simple" onclick="switchMode('simple')">
          Simplified
        </button>
        <button class="mode-btn" data-mode="detailed" onclick="switchMode('detailed')">
          Workout Details
        </button>
      </div>

      <!-- Legend — changes based on mode -->
      <div class="legend" id="legend"></div>

      <!-- Calendar -->
      <div class="calendar-section" id="calendarSection"></div>

    </div>

    <script src="script.js"></script>
  </body>
</html>
