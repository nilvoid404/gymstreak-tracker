<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#07080c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GymStreak" />
    <meta
      name="description"
      content="GymStreak — log workouts with your crew. Your streak, your records."
    />
    <title>GymStreak</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div class="phone" id="app">
      <main class="stage" id="stage"></main>

      <nav class="tabbar hidden" id="tabbar">
        <button type="button" data-go="home">
          <span class="ico">⌂</span><span>Home</span>
        </button>
        <button type="button" data-go="log">
          <span class="ico">＋</span><span>Log</span>
        </button>
        <button type="button" data-go="calendar">
          <span class="ico">▦</span><span>Cal</span>
        </button>
        <button type="button" data-go="bros">
          <span class="ico">⚑</span><span>Bros</span>
        </button>
        <button type="button" data-go="you">
          <span class="ico">●</span><span>You</span>
        </button>
      </nav>
    </div>

    <div class="toast hidden" id="toast"></div>
    <script src="/js/app.js"></script>
  </body>
</html>
